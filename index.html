<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --ink: #14181f;
  --muted: #5b6472;
  --line: #d8dce3;
  --accent: #1f5fd9;
  --accent-ink: #ffffff;
  --tint: #e7eefc;
  --ok: #17784a;
  --ok-ink: #ffffff;
  --warn: #a8510a;
  --warn-ink: #ffffff;
  --bad: #b3261e;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1217; --surface: #171c23; --ink: #eceff4; --muted: #9aa4b2; --line: #2a323d;
    --accent: #7aa5ff; --accent-ink: #0b1220; --tint: #1b2640; --ok: #4cc38a; --ok-ink: #0b1a12; --warn: #f0a04b; --warn-ink: #1a1208; --bad: #ff8a80;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 10px;
  border-bottom: 1px solid var(--line);
}
h1 { font-family: var(--f-display); font-weight: 700; font-size: 28px; letter-spacing: .01em; margin: 0; line-height: 1; }
.weekline { font-size: 13px; color: var(--muted); margin-top: 3px; }
.sync { display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.err { background: var(--bad); } .dot.busy { background: var(--warn); }
button { font: inherit; color: inherit; cursor: pointer; }
.btn {
  min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.big { min-height: 54px; font-size: 17px; width: 100%; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; }
.btn[disabled] { opacity: .55; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.banner { margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--tint); font-size: 14px; }
.banner.warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); }
.banner.bad { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
.banner .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 6px; }
.pill {
  flex: 1 1 84px; min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 4px 8px; line-height: 1.1;
  overflow-wrap: break-word; word-break: normal; hyphens: manual; text-wrap: balance; /* a capo solo dopo il "+" (vedi brkPill), mai a metà parola */
  font-family: var(--f-display); font-size: 21px; font-weight: 700; position: relative;
}
.pill[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pill small { display: block; font-family: var(--f-body); font-size: 11px; font-weight: 500; opacity: .85; margin-top: -2px; }
.sessionhead { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 0 4px; gap: 8px; flex-wrap: wrap; }
.sessionhead h2 { margin: 0; font-family: var(--f-display); font-size: 22px; font-weight: 600; }
.sessionhead span { color: var(--muted); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
.card h3 { margin: 0; font-family: var(--f-display); font-size: 21px; font-weight: 600; line-height: 1.15; }
.card .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
.chead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.chead h3 { flex: 1; min-width: 0; }
.startcard { text-align: center; padding: 20px 14px; }
.startcard .bigsess { font-family: var(--f-display); font-size: 40px; font-weight: 700; line-height: 1.05; margin-top: 4px; overflow-wrap: break-word; text-wrap: balance; }
.startcard .pills { margin: 14px 0 8px; }
.startcard .btn { margin-top: 14px; }
.activebar { background: var(--tint); border-color: var(--accent); }
.timebox { text-align: right; flex: none; }
.timebox b { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 24px; line-height: 1.1; }
.timebox span { font-size: 12px; color: var(--muted); }
.comp {
  min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--ok); color: var(--ok); background: transparent;
  font-weight: 600; font-size: 13px; white-space: nowrap; flex: none;
}
.card.done { padding: 0; }
.card.done.full { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); border-color: var(--ok); }
.card.done.partial { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); border-color: var(--warn); }
.card.done.full .cbadge { background: var(--ok); color: var(--ok-ink); }
.card.done.partial .cbadge { background: var(--warn); color: var(--warn-ink); }
.cdone { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px; background: transparent; border: 0; border-radius: 14px; text-align: left; }
.unsaved { color: var(--warn); display: flex; flex: none; margin-left: auto; }
.unsaved svg { width: 24px; height: 24px; }
.cname { font-family: var(--f-display); font-size: 21px; font-weight: 600; line-height: 1.15; min-width: 0; }
.cbadge { background: var(--muted); color: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; white-space: nowrap; flex: none; }
.spec { display: flex; align-items: stretch; margin-top: 8px; }
.spec .sc { display: flex; flex-direction: column; gap: 2px; padding: 0 16px; border-left: 1px solid var(--line); }
.spec .sc:first-child { padding-left: 0; border-left: 0; }
.spec .sc span { font-size: 12px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
.spec .sc b { font-family: var(--f-display); font-size: 26px; font-weight: 700; color: var(--ink); letter-spacing: .01em; line-height: 1.1; }
.sets { margin-top: 12px; }
.srow { display: grid; grid-template-columns: 34px minmax(0, 1fr) 64px 64px 40px; gap: 6px; align-items: center; margin-top: 8px; }
.shead { margin-top: 0; }
.shead span { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .03em; text-transform: uppercase; text-align: center; white-space: nowrap; }
.snum { width: 34px; height: 34px; border-radius: 8px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
.prev { text-align: center; font-family: var(--f-mono); font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow input[type="number"] { min-height: 44px; font-size: 18px; padding: 0 4px; }
.chk { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); display: flex; align-items: center; justify-content: center; padding: 0; }
.chk svg { width: 20px; height: 20px; }
.chk[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.rirrow { display: flex; margin-top: 12px; }
.rirrow .field { width: 120px; }
.last { margin-top: 8px; font-size: 14px; padding: 8px 10px; border-radius: 8px; background: var(--bg); }
.last b { font-family: var(--f-mono); font-weight: 500; }
.hint { color: var(--accent); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
input[type="number"], input[type="date"], input[type="time"], input[type="url"], input[type="text"], select {
  width: 100%; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  font-family: var(--f-mono); font-size: 18px; padding: 0 10px; text-align: center;
}
input[type="url"], input[type="text"] { font-size: 14px; text-align: left; padding: 10px; font-family: var(--f-body); }
select { font-family: var(--f-body); font-size: 16px; text-align: left; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.sesrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.sesrow:last-child { border-bottom: 0; }
.sesact { display: flex; gap: 6px; flex: none; }
.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.actions .btn { flex: 1; min-width: 120px; }
.saved { margin-top: 10px; font-size: 14px; color: var(--ok); font-weight: 600; }
details.note { margin-top: 10px; font-size: 14px; color: var(--muted); }
details.note summary { cursor: pointer; font-weight: 600; }
.tech { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
nav.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line);
  display: flex; justify-content: center;
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
nav.bottom .inner { display: flex; width: 100%; max-width: 640px; gap: 2px; }
nav.bottom button { flex: 1; min-width: 0; min-height: 48px; border: 0; background: transparent; border-radius: 10px; font-weight: 600; font-size: 11.5px; color: var(--muted); padding: 0 1px; }
nav.bottom button[aria-current="page"] { color: var(--accent); background: var(--tint); }
.timer {
  position: fixed; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 8; display: flex; justify-content: center;
  padding: 0 max(16px, env(safe-area-inset-left, 0px));
}
.timer .box { max-width: 640px; width: 100%; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.timer .time { font-family: var(--f-mono); font-size: 26px; }
.timer button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 8px; min-height: 36px; padding: 0 12px; }
h2.sec { font-family: var(--f-display); font-size: 24px; font-weight: 600; margin: 20px 0 6px; }
.chart { margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.chart svg { width: 100%; height: auto; display: block; }
.ax { stroke: var(--line); stroke-width: 1; }
.tx { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.table { overflow-x: auto; margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
tr:last-child td { border-bottom: 0; }
.empty { color: var(--muted); padding: 18px 4px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin-top: 8px; font-size: 14px; }
.kv span:nth-child(odd) { color: var(--muted); }
.stats { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
.stats div { min-width: 0; }
.stats b { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 22px; }
.stats span { font-size: 12px; color: var(--muted); }
.meta { color: var(--muted); font-size: 13px; }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 12;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; max-width: min(92vw, 560px); font-size: 14px;
}
.modal { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, .5); padding: 16px; }
.modal.open { display: flex; }
.modal .sheet { background: var(--surface); border-radius: 16px; padding: 16px; width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; }
.modal h2 { margin: 0 0 8px; font-family: var(--f-display); font-size: 24px; font-weight: 600; }
.modal .err { color: var(--bad); font-size: 14px; min-height: 20px; margin-top: 8px; }
.modal .actions { margin-top: 8px; }
[hidden] { display: none !important; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .btn, .pill { transition: background .15s, border-color .15s; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Palestra</h1>
      <div class="weekline" id="weekline">Carico il piano dal foglio…</div>
    </div>
    <div class="sync">
      <span class="dot busy" id="dot"></span>
      <button class="btn small" id="refresh" type="button">Aggiorna</button>
    </div>
  </header>
  <div id="alerts"></div>
  <main id="view"></main>
</div>
<div class="timer" id="timer" hidden>
  <div class="box"><span id="timerlabel">Recupero</span><span class="time" id="timertime">0:00</span><button type="button" id="timerstop">Stop</button></div>
</div>
<nav class="bottom" aria-label="Sezioni">
  <div class="inner">
    <button type="button" data-view="train" aria-current="page">Oggi</button>
    <button type="button" data-view="plan">Scheda</button>
    <button type="button" data-view="progress">Progressi</button>
    <button type="button" data-view="weight">Peso</button>
    <button type="button" data-view="food">Dieta</button>
    <button type="button" data-view="data">Dati</button>
  </div>
</nav>
<div id="toast" role="status" aria-live="polite" hidden></div>

<div class="modal" id="mSetup">
  <div class="sheet">
    <h2>Collega l'app</h2>
    <p class="meta">Incolla il link della web app Apps Script (finisce con <b>/exec</b>) seguito dal codice di accesso: <b>…/exec?token=…</b></p>
    <input id="setupUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec?token=…">
    <div class="err" id="setupErr"></div>
    <div class="actions"><button class="btn" id="setupCancel" type="button" style="display:none">Annulla</button><button class="btn primary" id="setupGo" type="button">Collega</button></div>
  </div>
</div>

<div class="modal" id="mFeel">
  <div class="sheet">
    <h2>Come è andata?</h2>
    <p class="meta">Quattro dati rapidi per regolare il piano. Puoi saltare.</p>
    <div class="grid2">
      <div class="field"><label for="f-energy">Energia (1-5)</label><select id="f-energy"><option value="">–</option><option value="1">1 · a terra</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5 · al top</option></select></div>
      <div class="field"><label for="f-sleep">Sonno stanotte (ore)</label><input id="f-sleep" type="number" inputmode="decimal" step="0.5" min="0" max="14" placeholder="7,5"></div>
      <div class="field"><label for="f-shoulder">Dolore spalle (0-3)</label><select id="f-shoulder"><option value="">–</option><option value="0">0 · niente</option><option value="1">1 · lieve</option><option value="2">2 · limita il carico</option><option value="3">3 · pungente</option></select></div>
      <div class="field"><label for="f-bicep">Bicipite sinistro (0-3)</label><select id="f-bicep"><option value="">–</option><option value="0">0 · niente</option><option value="1">1 · lieve</option><option value="2">2 · limita il carico</option><option value="3">3 · pungente</option></select></div>
    </div>
    <div class="actions"><button class="btn" id="fCancel" type="button">Torna alla sessione</button><button class="btn" id="fSkip" type="button">Salta</button><button class="btn primary" id="fGo" type="button">Salva sessione</button></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var SHEET_ID = "1g_xSOwU9JxPezqQqMlmsBI6uAxq2whm2Fi6SEluV5Ww";
  var SHEET_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/edit";
  var APP_BUILD = "02/11/2026 (4)";
  // Le chiavi hanno prefisso proprio: l'origine github.io è condivisa con gli altri progetti.
  var API_KEY = "palestra.api.v1", CACHE_KEY = "palestra.cache.v2", PENDING_KEY = "palestra.pending.v1", DONE_KEY = "palestra.done.v1", ACTIVE_KEY = "palestra.active.v1";
  var API_TIMEOUT = 40000, READ_RETRY = { readAll: 1 }, STALE_SESSION_MS = 8 * 3600 * 1000;
  var RATE_LOW = 0.15, RATE_HIGH = 0.35;

  var S = {
    api: false, apiState: "init", error: null, loading: false, lastSync: null,
    cfg: null, plan: [], log: [], peso: [], sessLog: [], nutr: [], raw: null,
    view: "train", active: null, pick: null, planSess: null, ending: false, endReq: null, addForm: false, delAsk: null,
    done: {}, drafts: {}, progEx: null, pending: [], exportLinks: [], timer: null
  };

  /* ---------- utilità ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function dmy(d) { return d ? pad(d.getDate()) + "/" + pad(d.getMonth() + 1) : ""; }
  function hhmm(ms) { var d = new Date(ms); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function parseDMY(s) {
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s || "").trim());
    if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
    m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || "").trim());
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function dayDiff(a, b) { return Math.round((midnight(a) - midnight(b)) / 864e5); }
  function num(s) { var n = parseFloat(String(s).replace(",", ".")); return isNaN(n) ? null : n; }
  function fmtKg(n) { return n == null ? "–" : (Math.round(n * 100) / 100).toString().replace(".", ","); }
  function fmtRest(s) { return Math.floor(s / 60) + ":" + pad(s % 60); }
  function fmtElapsed(ms) {
    var t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    return h + ":" + pad(m) + ":" + pad(s);
  }
  function fmtDur(min) { return min == null ? "–" : min >= 60 ? Math.floor(min / 60) + " h " + pad(Math.round(min % 60)) + " min" : Math.round(min) + " min"; }
  function dash(n) { return n == null ? "–" : String(n).replace(".", ","); }
  function list(s) { return String(s || "").split(",").map(function (x) { return parseInt(x, 10); }).filter(function (x) { return !isNaN(x); }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  function load(key, fallback) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
  function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* storage non disponibile */ } }
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 3600);
  }

  /* ---------- modello ---------- */
  function parseModel(raw) {
    var rows = raw.cfg || [];

  /* ---------- grafici ---------- */
  function lineChart(series, opt) {
    var W = 600, H = 220, L = 44, R = 14, T = 12, B = 28, xs = [], ys = [];
    series.forEach(function (s) { s.pts.forEach(function (p) { xs.push(p.x); ys.push(p.y); }); });
    if (!xs.length) return "";
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    if (opt && opt.x0 != null) x0 = Math.min(x0, opt.x0); if (opt && opt.x1 != null) x1 = Math.max(x1, opt.x1);
    if (x1 === x0) x1 = x0 + 1;
    var padY = (y1 - y0) * 0.15 || 1; y0 -= padY; y1 += padY;
    function X(v) { return L + (v - x0) / (x1 - x0) * (W - L - R); }
    function Y(v) { return T + (1 - (v - y0) / (y1 - y0)) * (H - T - B); }
    var out = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(opt.label) + '">';
    for (var i = 0; i <= 3; i++) {
      var yv = y0 + (y1 - y0) * i / 3;
      out += '<line class="ax" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(yv) + '" y2="' + Y(yv) + '"/>';
      out += '<text class="tx" x="' + (L - 6) + '" y="' + (Y(yv) + 4) + '" text-anchor="end">' + (Math.round(yv * 10) / 10) + "</text>";
    }
    var step = Math.max(1, Math.ceil((x1 - x0) / 7));
    for (var xv = Math.ceil(x0); xv <= x1; xv += step) out += '<text class="tx" x="' + X(xv) + '" y="' + (H - 8) + '" text-anchor="middle">' + xv + "</text>";
    series.forEach(function (s) {
      var d = s.pts.map(function (p, k) { return (k ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1); }).join(" ");
      out += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="' + (s.dash ? 2 : 2.75) + '"' + (s.dash ? ' stroke-dasharray="6 5"' : "") + ' stroke-linejoin="round" stroke-linecap="round"/>';
      if (!s.dash) s.pts.forEach(function (p) { out += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="4" fill="var(--surface)" stroke="' + s.color + '" stroke-width="2.5"/>'; });
    });
    return out + "</svg>";
  }

    if (pts.length > 1) h += '<div class="chart">' + lineChart([{ pts: pts, color: "var(--accent)" }], { label: "Carico massimo per settimana", x0: 1 }) + "</div>";
    h += '<div class="table"><table><thead><tr><th>Data</th><th>Sett.</th><th>Carico</th><th>Reps</th><th>RIR</th></tr></thead><tbody>' +
      entries.slice().reverse().slice(0, 15).map(function (e) { return "<tr><td>" + dmy(e.date) + "</td><td>" + (e.week || "") + "</td><td>" + fmtKg(e.kg) + " kg</td><td>" + esc(parseSets(e).map(function (x) { return x.reps; }).join("-") || fmtKg(e.reps)) + "</td><td>" + esc(e.rir) + "</td></tr>"; }).join("") + "</tbody></table></div>";
    return h;
  }
  function weeklyWeights() {
    var map = {}, start = S.cfg.start; if (!start) return {};
    S.peso.forEach(function (p) {
      var w = Math.floor(dayDiff(p.date, start) / 7) + 1; if (w < 1) return;
      (map[w] = map[w] || []).push(p.kg);
    });
    var out = {}; Object.keys(map).forEach(function (w) { out[w] = map[w].reduce(function (a, b) { return a + b; }, 0) / map[w].length; });
    return out;
  }
  // Media dell'ultima settimana pesata e ritmo sulle ultime 3 settimane (null se non ci sono 4 settimane di dati).
  function weightTrend() {
    var wk = weeklyWeights(), ws = Object.keys(wk).map(Number).sort(function (a, b) { return a - b; });
    if (!ws.length) return null;
    var cur = ws[ws.length - 1];
    return { week: cur, avg: wk[cur], rate: wk[cur - 3] != null ? (wk[cur] - wk[cur - 3]) / 3 : null };
  }
  function latestWeight() {
    var best = null;
    S.peso.forEach(function (p) { if (!best || p.date >= best.date) best = p; });
    return best ? best.kg : S.cfg && S.cfg.w0;
  }
  function viewWeight() {
    var cfg = S.cfg, h = '<h2 class="sec">Peso</h2><div class="kgrow"><div class="field"><label for="w-kg">Peso (kg)</label><input id="w-kg" type="number" inputmode="decimal" step="0.1" placeholder="68,0"></div>' +
      '<div class="field"><label for="w-date">Data</label><input id="w-date" type="date" value="' + iso(new Date()) + '"></div></div>' +
      '<div class="actions"><button type="button" class="btn primary" data-act="saveweight">Salva peso</button></div>';
    var wk = weeklyWeights(), ws = Object.keys(wk).map(Number).sort(function (a, b) { return a - b; });
    if (ws.length) {
      var cur = ws[ws.length - 1], rate = null, label = "";
      if (wk[cur - 3] != null) {
        rate = (wk[cur] - wk[cur - 3]) / 3;
        label = rate < RATE_LOW ? "sotto ritmo: aggiungi 150-200 kcal al giorno" : rate > RATE_HIGH ? "troppo veloce: togli circa 150 kcal al giorno" : "in linea";
      }
      h += '<div class="stats"><div><b>' + fmtKg(wk[cur]) + '</b><span>media settimana ' + cur + ' (kg)</span></div><div><b>' + fmtKg(cfg.goal) + '</b><span>obiettivo (kg)</span></div>' +
        (rate != null ? '<div><b>' + (rate >= 0 ? "+" : "") + (Math.round(rate * 100) / 100).toString().replace(".", ",") + '</b><span>kg a settimana (3 sett.)</span></div>' : "") + "</div>";
      if (label) h += '<p class="meta">Ritmo ' + esc(label) + ".</p>";
      var series = [{ pts: ws.map(function (w) { return { x: w, y: wk[w] }; }), color: "var(--accent)" }];
      if (cfg.w0 != null && cfg.goal != null) series.push({ pts: [{ x: 0, y: cfg.w0 }, { x: cfg.weeks, y: cfg.goal }], color: "var(--muted)", dash: true });
      h += '<div class="chart">' + lineChart(series, { label: "Peso medio settimanale e target", x0: 0, x1: cfg.weeks }) + '</div><p class="meta">Linea tratteggiata: target dal peso iniziale all\'obiettivo.</p>';
    } else h += '<p class="empty">Nessun peso registrato dall\'inizio del piano.</p>';
    var recent = S.peso.slice().sort(function (a, b) { return b.date - a.date; }).slice(0, 8);
    if (recent.length) h += '<div class="table"><table><thead><tr><th>Data</th><th>Peso</th></tr></thead><tbody>' + recent.map(function (p) { return "<tr><td>" + dmy(p.date) + "</td><td>" + fmtKg(p.kg) + " kg</td></tr>"; }).join("") + "</tbody></table></div>";
    return h;
  }
  // Indicazioni di calorie e proteine dall'ultima media registrata, dal ritmo del peso e dal target di Config.
  function foodAdvice(last, kg, trend) {
    var out = [], cfg = S.cfg;
    var protTarget = cfg.protGoal || (kg ? Math.round(kg * 1.9) : null);
    if (protTarget && last.prot != null && last.prot < protTarget * 0.9) {
      out.push("Proteine sotto il target: mancano circa " + Math.round(protTarget - last.prot) + " g al giorno. Una porzione di yogurt greco o skyr, due uova o più soia e legumi nei pasti li coprono.");
    } else if (protTarget && last.prot != null) out.push("Proteine in linea con il target.");
    if (trend && trend.rate != null) {
      if (trend.rate < RATE_LOW) out.push("Il peso sale sotto il ritmo (" + (Math.round(trend.rate * 100) / 100).toString().replace(".", ",") + " kg a settimana): porta le calorie a circa " + (Math.round((last.kcal + 175) / 10) * 10) + " kcal al giorno.");
      else if (trend.rate > RATE_HIGH) out.push("Il peso sale troppo in fretta: togli circa 150 kcal al giorno, cioè " + (Math.round((last.kcal - 150) / 10) * 10) + " kcal.");
      else out.push("Il peso sale al ritmo giusto: non cambiare le calorie.");
    } else out.push("Servono 4 settimane di pesate per valutare il ritmo e correggere le calorie.");
    if (cfg.kcalGoal && last.kcal < cfg.kcalGoal * 0.93) out.push("Le calorie sono " + Math.round(cfg.kcalGoal - last.kcal) + " kcal sotto il target di " + cfg.kcalGoal + ": è la prima cosa da sistemare se il peso non sale.");
    return out;
  }
  function viewFood() {
    var cfg = S.cfg, wkNow = weekInfo().n, rows = S.nutr.slice().sort(function (a, b) { return a.week - b.week; });
    var cur = null; rows.forEach(function (x) { if (x.week === wkNow) cur = x; });
    var h = '<h2 class="sec">Nutrizione</h2><p class="meta">Una volta a settimana (la domenica) inserisci la media giornaliera di calorie e proteine. Se salvi di nuovo nella stessa settimana, la riga viene aggiornata.</p>' +
      '<div class="grid2"><div class="field"><label for="n-kcal">Kcal medie al giorno</label><input id="n-kcal" type="number" inputmode="numeric" step="10" min="0" placeholder="2650" value="' + esc(cur ? cur.kcal : "") + '"></div>' +
      '<div class="field"><label for="n-prot">Proteine medie (g)</label><input id="n-prot" type="number" inputmode="numeric" step="1" min="0" placeholder="140" value="' + esc(cur ? cur.prot : "") + '"></div>' +
      '<div class="field"><label for="n-date">Data</label><input id="n-date" type="date" value="' + iso(new Date()) + '"></div>' +
      '<div class="field"><label for="n-note">Note</label><input id="n-note" type="text" maxlength="200" placeholder="es. settimana fuori casa" value="' + esc(cur ? cur.note : "") + '"></div></div>' +
      '<div class="actions"><button type="button" class="btn primary" data-act="savenutr">Salva settimana ' + wkNow + "</button></div>";
    if (!rows.length) return h + '<p class="empty">Nessuna settimana registrata.' + (cfg.kcalGoal ? " Punto di partenza: circa " + cfg.kcalGoal + " kcal" + (cfg.protGoal ? " e " + cfg.protGoal + " g di proteine" : "") + " al giorno." : "") + "</p>";
    var last = rows[rows.length - 1], kg = latestWeight(), trend = weightTrend(), wk = weeklyWeights();
    h += '<div class="stats"><div><b>' + last.kcal + "</b><span>kcal medie (sett. " + last.week + ")" + (cfg.kcalGoal ? ", target " + cfg.kcalGoal : "") + '</span></div><div><b>' + dash(last.prot) + "</b><span>proteine (g)" + (cfg.protGoal ? ", target " + cfg.protGoal : "") + "</span></div>" +
      (kg && last.prot != null ? '<div><b>' + (Math.round(last.prot / kg * 100) / 100).toString().replace(".", ",") + "</b><span>g di proteine per kg</span></div>" : "") + "</div>";
    foodAdvice(last, kg, trend).forEach(function (t) { h += '<div class="banner">' + esc(t) + "</div>"; });
    if (rows.length > 1) {
      var series = [{ pts: rows.map(function (x) { return { x: x.week, y: x.kcal }; }), color: "var(--accent)" }];
      if (cfg.kcalGoal) series.push({ pts: [{ x: rows[0].week, y: cfg.kcalGoal }, { x: last.week, y: cfg.kcalGoal }], color: "var(--muted)", dash: true });
      h += '<div class="chart">' + lineChart(series, { label: "Calorie medie per settimana e target" }) + "</div>";
    }
    h += '<div class="table"><table><thead><tr><th>Sett.</th><th>Data</th><th>Kcal</th><th>Prot.</th><th>g/kg</th><th>Note</th></tr></thead><tbody>' +
      rows.slice().reverse().slice(0, 8).map(function (x) {
        var w = wk[x.week] || kg;
        return "<tr><td>" + x.week + "</td><td>" + dmy(x.date) + "</td><td>" + x.kcal + "</td><td>" + dash(x.prot) + "</td><td>" + (w && x.prot != null ? (Math.round(x.prot / w * 100) / 100).toString().replace(".", ",") : "–") + "</td><td>" + esc(x.note) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
    return h + '<p class="meta">Indicazioni di carattere generale basate sul tuo peso e sui target del foglio Config.</p>';
  }
  function feelLine(r) {
    var p = [];
    if (r.energy != null) p.push("energia " + dash(r.energy));
    if (r.sleep != null) p.push("sonno " + dash(r.sleep) + " h");
    if (r.shoulder != null) p.push("spalle " + r.shoulder);
    if (r.bicep != null) p.push("bic. sx " + r.bicep);
    return p.length ? " · " + p.join(" · ") : "";
  }
  function viewData() {
    var h = '<h2 class="sec">Dati</h2><div class="card"><div class="kv"><span>Archivio</span><span><a href="' + SHEET_URL + '" target="_blank" rel="noopener">Tracker Ipertrofia</a></span>' +
      "<span>Ultimo aggiornamento</span><span>" + (S.lastSync ? pad(S.lastSync.getDate()) + "/" + pad(S.lastSync.getMonth() + 1) + " " + pad(S.lastSync.getHours()) + ":" + pad(S.lastSync.getMinutes()) : "mai") + "</span>" +
      "<span>Esercizi nel piano</span><span>" + S.plan.length + "</span><span>Esercizi registrati</span><span>" + S.log.length + "</span><span>Sessioni registrate</span><span>" + S.sessLog.length + "</span><span>Settimane di nutrizione</span><span>" + S.nutr.length + "</span><span>Voci da sincronizzare</span><span>" + S.pending.length + "</span>" +
      "<span>Versione app</span><span>" + APP_BUILD + "</span></div>" +
      '<div class="actions"><button type="button" class="btn" data-act="reload">Aggiorna dal foglio</button><button type="button" class="btn" data-act="export">Esporta CSV su Drive</button></div>' +
      '<div class="actions"><button type="button" class="btn" data-act="relink">Collegamento</button><button type="button" class="btn" data-act="updapp">Aggiorna app</button></div>';
    if (S.exportLinks.length) h += '<p class="meta">' + S.exportLinks.map(function (l) { return l.url ? '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.name) + "</a>" : esc(l.name); }).join(" · ") + " salvati su Drive.</p>";
    h += "</div>";
    h += '<h2 class="sec">Sessioni</h2>' + (S.addForm ? sessionForm() : '<div class="actions"><button type="button" class="btn" data-act="addform">Aggiungi sessione</button></div>');
    var rec = S.sessLog.slice().sort(function (a, b) { return (b.date - a.date) || (b.row - a.row); }).slice(0, 10);
    if (rec.length) h += '<div class="table">' + rec.map(function (r) {
      var cell = !r.row ? "" : S.delAsk === r.row
        ? '<button type="button" class="btn small" data-delsess="' + r.row + '">Conferma</button><button type="button" class="btn small" data-act="delcancel">No</button>'
        : '<button type="button" class="btn small" data-delask="' + r.row + '" aria-label="Elimina sessione del ' + dmy(r.date) + '">Elimina</button>';
      return '<div class="sesrow"><div><b>' + dmy(r.date) + "</b> · Sessione " + esc(r.s) + '<div class="meta">' + esc(r.start) + (r.end ? "–" + esc(r.end) : "") + " · " + fmtDur(r.dur) + feelLine(r) + '</div></div><div class="sesact">' + cell + "</div></div>";
    }).join("") + "</div>";
    else h += '<p class="empty">Nessuna sessione registrata.</p>';
    h += '<p class="meta">Il piano (esercizi, serie, reps, recuperi, RIR, settimane di scarico) vive nel foglio. Se lo fai modificare a Claude, l\'app lo legge al prossimo avvio o con Aggiorna.</p>';
    return h;
  }
  function render() {
    renderAlerts(); renderWeekline();
    var v = $("view");
    if (!S.cfg) { v.innerHTML = '<p class="empty">' + (S.loading ? "Carico il piano e lo storico dal foglio…" : "Nessun dato ancora caricato.") + "</p>"; }
    else v.innerHTML = S.view === "train" ? viewTrain() : S.view === "plan" ? viewPlan() : S.view === "progress" ? viewProgress() : S.view === "weight" ? viewWeight() : S.view === "food" ? viewFood() : viewData();
    document.querySelectorAll("nav.bottom button").forEach(function (b) { if (b.dataset.view === S.view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  }

  /* ---------- export ---------- */
  async function exportCsv() {
    try {
      S.exportLinks = (await gs("exportCsv")) || [];
      toast("CSV salvati su Drive.");
    } catch (e) { toast(errMsg(e).text); }
    render();
  }

  /* ---------- collegamento e aggiornamento app ---------- */
  function showSetup(msg, cancellable) {
    $("setupErr").textContent = msg || "";
    $("setupCancel").style.display = cancellable ? "" : "none";
    $("mSetup").className = "modal open";
  }
  function saveLink() {
    var p = parseLink($("setupUrl").value);
    if (!p || !p.token) { $("setupErr").textContent = "Link non valido: deve finire con /exec?token=…"; return; }
    $("setupErr").textContent = "Verifico…";
    gsFetch(p, "readRange", ["Config!A3:B4"]).then(function () {
      store(API_KEY, p); location.reload();
    }, function (e) {
      $("setupErr").textContent = e && e.code === "needs_reauth" ? "Codice di accesso errato." : "Impossibile raggiungere Apps Script (" + ((e && e.message) || "errore") + ").";
    });
  }
  function updateApp() {
    var done = function () { location.reload(); };
    if (!("serviceWorker" in navigator)) return done();
    navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
      .then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf("palestra-") === 0; }).map(function (k) { return caches.delete(k); })); }) : null; }).then(done, done);
  }

  /* ---------- eventi ---------- */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("button"); if (!t) return;
    if (t.dataset.view) { S.view = t.dataset.view; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.pick) { S.pick = t.dataset.pick; render(); return; }
    if (t.dataset.psess) { S.planSess = t.dataset.psess; render(); return; }
    if (t.dataset.complete != null) { toggleDone(+t.dataset.complete); return; }
    if (t.dataset.save != null) { saveExercise(+t.dataset.save); return; }
    if (t.dataset.rest != null) { var p = activeItems()[+t.dataset.rest]; if (p) startTimer(p.rest, p.name); return; }
    if (t.dataset.chk != null) { toggleSet(+t.dataset.ci, +t.dataset.cj); return; }
    if (t.dataset.delask != null) { S.delAsk = +t.dataset.delask; render(); return; }
    if (t.dataset.delsess != null) { deleteSession(+t.dataset.delsess); return; }
    var act = t.dataset.act;
    if (act === "addform") { S.addForm = true; render(); }
    else if (act === "addcancel") { S.addForm = false; render(); }
    else if (act === "addsess") addSession();
    else if (act === "delcancel") { S.delAsk = null; render(); }
    else if (act === "reload" || t.id === "refresh") loadAll();
    else if (act === "flush") flushPending(false).then(render);
    else if (act === "saveweight") saveWeight();
    else if (act === "savenutr") saveNutrition();
    else if (act === "export") exportCsv();
    else if (act === "startsess") startSession(pickSession());
    else if (act === "endsess") endSession(false);
    else if (act === "endnoend") endSession(true);
    else if (act === "discard") discardSession();
    else if (act === "relink") { var a = apiCfg(); $("setupUrl").value = a ? a.url + (a.token ? "?token=" + a.token : "") : ""; showSetup("", true); }
    else if (act === "updapp") updateApp();
    else if (t.id === "timerstop") stopTimer();
  });
  document.addEventListener("input", function (ev) {
    var idx = ev.target.dataset && ev.target.dataset.draft; if (idx == null) return;
    saveDraft(+idx);
  });
  document.addEventListener("change", function (ev) { if (ev.target.id === "prog-ex") { S.progEx = ev.target.value; render(); } });
  $("setupGo").onclick = saveLink;
  $("setupCancel").onclick = function () { $("mSetup").className = "modal"; };
  $("fGo").onclick = function () { finishSession(readFeel()); };
  $("fSkip").onclick = function () { finishSession(null); };
  $("fCancel").onclick = function () { S.endReq = null; $("mFeel").className = "modal"; };
  window.addEventListener("online", function () { if (S.api && !S.loading) flushPending(true).then(render); });

  /* ---------- avvio ---------- */
  async function boot() {
    S.pending = load(PENDING_KEY, []);
    S.active = load(ACTIVE_KEY, null);
    var savedDone = load(DONE_KEY, {}), todayPrefix = iso(new Date()) + "|";
    Object.keys(savedDone).forEach(function (k) { if (k.indexOf(todayPrefix) === 0) S.done[k] = true; });
    store(DONE_KEY, S.done);
    var cache = load(CACHE_KEY, null);
    if (cache && cache.raw) { try { applyModel(cache.raw); S.lastSync = new Date(cache.at); } catch (e) { /* cache non valida */ } }
    S.loading = true; render();
    if (!apiCfg()) { S.apiState = "none"; S.loading = false; setStatus("err"); render(); showSetup("", false); return; }
    S.api = true; S.apiState = "ok";
    await loadAll();
  }
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function () {});
  boot();
})();
</script>
</body>
</html>
